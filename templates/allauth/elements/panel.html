{% load allauth %}
<section class="border border-base-200 mb-4 p-4 rounded-default dark:border-base-800">
    <h2 class="font-semibold mb-2 text-font-important-light dark:text-font-important-dark">{% slot title %}{% endslot %}</h2>
    {% slot body %}{% endslot %}
    {% if slots.actions %}<div class="flex flex-col gap-2 mt-2">{% for accion in slots.actions %}{{ accion }}{% endfor %}</div>{% endif %}
</section>
