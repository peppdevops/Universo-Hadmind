{% load allauth %}
<form method="{{ attrs.method }}" {% if attrs.action %}action="{{ attrs.action }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %}>
    {% slot body %}{% endslot %}
    {% if slots.actions %}
        <div class="flex flex-col gap-3 mt-6">{% slot actions %}{% endslot %}</div>
    {% endif %}
</form>
