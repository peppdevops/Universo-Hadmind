# Nginx del sitio hadmind.com.co en el VPS, para el día del lanzamiento.
#
# NO se copia tal cual: Certbot ya escribió en /etc/nginx/sites-available/hadmind
# las líneas de los certificados (ssl_certificate...). Se reemplaza solo lo que
# hay DENTRO del bloque "server { listen 443 ... }": el "root /var/www/hadmind"
# y su "location /" por las tres partes de abajo.
#
# Antes de tocar nada, copia de seguridad para poder volver atrás:
#   sudo cp /etc/nginx/sites-available/hadmind /etc/nginx/sites-available/hadmind.respaldo
# Después de editar:
#   sudo nginx -t && sudo systemctl reload nginx

    # 1) Tamaño máximo de lo que se envía al sitio. Por defecto Nginx acepta
    #    1 MB y rechazaría la imagen que n8n manda a /api/bitacora/ (la app
    #    acepta hasta 10 MB; se deja un margen).
    client_max_body_size 15m;

    # 2) Imágenes de la Bitácora. Las sirve Nginx directo desde la carpeta del
    #    VPS (más rápido que pasar por Django). Son WebP generadas por la app.
    location /media/ {
        alias /opt/hadmind-web/media/;
        expires 30d;
        add_header Cache-Control "public";
        # El navegador no adivina el tipo: un archivo nunca se ejecuta como página
        add_header X-Content-Type-Options "nosniff";
        # Sin listar carpetas
        autoindex off;
    }

    # 3) Todo lo demás va a Django (gunicorn en el puerto 8003).
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;   # Django sabe que es https
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # La IA + imagen tardan en n8n, pero aquí solo se guarda: 60 s sobra
        proxy_read_timeout 60s;
    }
