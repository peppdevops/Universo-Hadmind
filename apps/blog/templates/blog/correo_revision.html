<!DOCTYPE html>
{% comment %}
Correo de aprobación de la Bitácora. Lo genera la API y n8n lo envía tal cual.
Hecho con tablas y estilos en línea porque Gmail y Outlook ignoran casi todo
el CSS normal (flex, grid, <style>).
{% endcomment %}
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Revisa el artículo de la Bitácora</title>
</head>
<body style="margin:0;padding:0;background:#F2F7FF;">
    {# Texto que Gmail muestra junto al asunto en la bandeja #}
    <div style="display:none;max-height:0;overflow:hidden;">{{ articulo.resumen }}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F2F7FF;">
        <tr>
            <td align="center" style="padding:24px 12px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;font-family:Inter,'Segoe UI',Arial,sans-serif;color:#020617;">
                    <tr>
                        <td style="padding:0 4px 14px;font-size:13px;font-weight:700;letter-spacing:2px;color:#3E83D6;">HADMIND · BITÁCORA</td>
                    </tr>
                    <tr>
                        <td style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;">
                            {% if url_imagen %}
                            <img src="{{ url_imagen }}" alt="{{ articulo.texto_alternativo }}" width="600" style="display:block;width:100%;max-width:600px;height:auto;border:0;border-radius:16px 16px 0 0;">
                            {% endif %}
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="padding:24px 24px 8px;">
                                        <p style="margin:0 0 6px;font-size:14px;color:#5B6B86;">Hay un artículo nuevo esperando tu aprobación:</p>
                                        <p style="margin:12px 0 0;font-size:12px;font-weight:700;letter-spacing:1px;color:#2F6DB8;">{{ articulo.get_categoria_display|upper }}</p>
                                        <h1 style="margin:8px 0 12px;font-size:24px;line-height:1.25;font-weight:700;color:#020617;">{{ articulo.titulo }}</h1>
                                        <p style="margin:0;font-size:16px;line-height:1.55;color:#475569;">{{ articulo.resumen }}</p>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding:20px 24px 8px;">
                                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td style="border-radius:10px;background:#3E83D6;">
                                                    <a href="{{ url_revision }}" style="display:inline-block;padding:14px 26px;font-size:16px;font-weight:700;color:#FFFFFF;text-decoration:none;">Revisar y publicar</a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding:12px 24px 24px;font-size:13px;line-height:1.5;color:#5B6B86;">
                                        En esa página puedes leerlo completo, publicarlo, descartarlo o cambiar la imagen.
                                        Abrir el enlace no publica nada. Vence en {{ dias_vigencia }} días; después puedes revisarlo en el admin, en Contenido → Bitácora.
                                        {% if articulo.fuente_url %}<br><br>Fuente: <a href="{{ articulo.fuente_url }}" style="color:#2F6DB8;">{{ articulo.fuente_nombre|default:articulo.fuente_url }}</a>{% endif %}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:14px 4px 0;font-size:12px;line-height:1.5;color:#94A3B8;">Correo automático del flujo semanal de n8n. No compartas este correo: el botón da acceso para publicar sin iniciar sesión.</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
